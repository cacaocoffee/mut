# ISSUE-004 — 계약 드리프트 게이트 (PRIN-T02)
#
# > 계약이 깨지면 빌드가 깨져야 한다. 런타임에 발견하지 않는다.
#
# Kotlin 을 고치면 openapi.json 이 바뀌고, openapi.json 이 바뀌면 생성 TS 가 바뀐다.
# 셋 중 하나만 커밋하면 여기서 걸린다.
#
# api.yml 과 분리한 이유: 이 워크플로는 apps/api 와 packages/domain **양쪽**을 본다.
# 어느 한쪽만 고쳐도 계약은 어긋날 수 있다.
name: contract

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/domain/**"
      - "scripts/generate-types.mjs"
      - "scripts/taxonomy-parity.mjs"
      - "scripts/facet-parity.ts"
      - ".github/workflows/contract.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "packages/domain/**"
      - "scripts/generate-types.mjs"
      - "scripts/taxonomy-parity.mjs"
      - "scripts/facet-parity.ts"
      - ".github/workflows/contract.yml"

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # PRIN-T01

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Testcontainers 가 테스트 안에서 이미지를 받으면 받기 지연이 곧 테스트 실패로 나타난다.
      # 실제로 PR #62 에서 ContainerFetchException 으로 202건이 통째로 무너졌다 —
      # 코드 문제가 아닌데 로그만 보면 그렇게 보이지 않는다.
      # 미리 받아 두면 실패 지점이 여기로 드러나고 재시도도 할 수 있다.
      - name: PG16 이미지 미리 받기
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && exit 0
            echo "::warning::이미지 받기 실패, 재시도 $i/3"
            sleep 15
          done
          echo "::error::postgres:16-alpine 을 받지 못했다"
          exit 1

      # Kotlin → openapi.json. Testcontainers 로 PG16 을 띄운다.
      - name: 계약 재생성
        working-directory: apps/api
        run: ./gradlew generateOpenApiDocs --no-daemon

      # openapi.json → packages/domain/src/generated/api.ts
      - name: 생성 타입 재생성
        run: npm run generate:types

      # 분류 축이 프로토타입 types.ts 와 어긋나지 않는가 (G-23 의 알려진 차이는 등록돼 있다)
      - name: 분류 축 대조
        run: node scripts/taxonomy-parity.mjs

      # 생성물이 최신이 아니면 여기서 멈춘다. 이 스텝이 이 워크플로의 존재 이유다.
      - name: 드리프트 확인
        run: |
          if ! git diff --exit-code; then
            echo "::error::생성물이 최신이 아니다. 아래를 돌리고 함께 커밋한다."
            echo "  cd apps/api && ./gradlew generateOpenApiDocs"
            echo "  npm run generate:types"
            exit 1
          fi

  # ISSUE-040 RED 19·20 — 클라이언트 패싯이 서버와 같은가 (INDEX 결합점 019←040)
  #
  # SPEC-05 §4·§5 가 Phase 1 에서 필터와 패싯을 **클라이언트에서** 계산하게 두고
  # 서버에도 같은 계약을 두게 했다. 계산이 두 벌이라 갈라질 수 있고, 갈라지면 화면의
  # 개수가 조용히 거짓말을 한다. 같은 쿼리스트링을 양쪽에 주고 맞춰 본다.
  #
  # drift 와 나눈 이유: 저쪽은 생성물만 보면 되고 이쪽은 **API 를 띄워야** 한다.
  # 한 잡에 합치면 계약 드리프트가 API 기동 실패로 가려진다.
  facet-parity:
    runs-on: ubuntu-latest

    # Testcontainers 가 아니라 서비스 컨테이너다 — 여기서는 앱이 붙을 DB 가 먼저 있어야 한다.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # 데이터베이스 이름은 옛 이름 그대로다 — 롤이 V001 안에 있고 마이그레이션은
          # 불변이라 짝을 맞춘다 (G-40). 아래 DB_URL 과 같은 값이어야 한다
          POSTGRES_DB: mut
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # PRIN-T01

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: 서버 빌드
        working-directory: apps/api
        run: ./gradlew bootJar --no-daemon

      # 마이그레이션과 시드(R__seed_*.sql)가 기동 중에 돈다 — 대조할 코퍼스가 그것이다.
      # 슈퍼유저로 붙는다: 역할 분리는 V001 이 만들고, CI 에서 운영 계정을 흉내 낼 이유가 없다.
      - name: 서버 기동
        working-directory: apps/api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/mut
          DB_USER: postgres
          DB_PASSWORD: postgres
          MUT_RATE_LIMIT_ENABLED: "false" # 대조가 수십 번 부른다. 429 를 대조 실패로 읽지 않는다
          MUT_VERIFICATION_SCHEDULED: "false"
        run: |
          JAR=$(ls build/libs/*.jar | grep -v plain | head -1)
          nohup java -jar "$JAR" > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/actuator/health > /dev/null; then
              echo "기동 완료 (${i}회차)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::서버가 180초 안에 뜨지 않았다"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: 클라이언트 · 서버 패싯 대조
        env:
          MUT_API_URL: http://localhost:8080
        # --require-api: 주소가 없으면 통과가 아니라 실패다. CI 는 관용하지 않는다.
        run: npm run facet:parity -- --require-api

      - name: 서버 로그 보존
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: facet-parity-api-log
          path: ${{ runner.temp }}/api.log
          retention-days: 7
