# ISSUE-046 — 프론트 품질 게이트 (SPEC-04 §9.1)
#
# > **배포를 막는 것**과 경고만 하는 것을 구분한다.
# > 전부를 차단으로 만들면 아무것도 못 나간다. (SPEC-04 §9)
#
# | 검사 | 근거 | 성격 |
# |---|---|---|
# | `npm run check` · 계약 · lint · 타입 · 빌드 | `NFR-D-01` | 차단 |
# | e2e (axe · 사이트맵 · 화면 동작) | `NFR-A-01~03`·`A-05`, `NFR-S-02~03` | 차단 |
# | Lighthouse | `NFR-P-01~03` | 차단 |
# | 번들 크기 | `NFR-P-04` | **경고** |
#
# api.yml · contract.yml 과 나눈 이유: 저쪽은 서버와 계약을 보고 이쪽은 **화면**을 본다.
# 서버를 고쳤다고 Lighthouse 를 돌릴 이유가 없고, 그 반대도 마찬가지다.
name: web-quality

on:
  push:
    branches: [main]
    paths: &paths
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/domain/**"
      - "scripts/**"
      - ".github/workflows/web-quality.yml"
  pull_request:
    paths: *paths

jobs:
  # ── 차단: 정적 검사와 빌드 ────────────────────────────────────────────────
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # 코퍼스 불변식 · 분류 축 대조 · CSS 게이트 · 색 왕복 · 대비 (NFR-D-01)
      - name: check
        run: npm run check

      # 생성 타입이 최신인가. 계약과 화면이 갈라지면 여기서 멈춘다 (PRIN-T02)
      - name: 계약 드리프트
        run: npm run contract:check

      - name: 타입
        run: npx tsc --noEmit -p apps/web

      - name: lint
        run: npm run lint

      - name: 빌드
        run: npm run build

      # NFR-P-04 — **경고다.** 넘었다고 배포를 막지 않는다 (SPEC-04 §9.1).
      # 스크립트도 종료 코드 0 으로 끝나지만, 여기 한 줄을 더 둬서 성격을 워크플로에도 적어 둔다.
      - name: 번들 예산 (경고)
        continue-on-error: true
        run: npm run bundle:budget

  # ── 차단: 브라우저에서 보는 것 ────────────────────────────────────────────
  #
  # axe(접근성) · 사이트맵 allowlist · 화면 동작이 한 러너 안에 있다. 브라우저를 두 번
  # 띄우지 않는 것이 이 배치의 이유다 — 같은 프로덕션 빌드를 한 번 띄워 전부 본다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 브라우저 받기
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # `playwright.config.ts` 의 webServer 가 빌드하고 띄운다.
      - name: e2e
        run: npm run e2e

      - name: 실패 리포트 보존
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # ── 차단: 성능 (NFR-P-01~03) ──────────────────────────────────────────────
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run build

      # 상세·카테고리는 2.0s, 나머지는 2.5s (SPEC-04 §1.1) — 기준은 lighthouserc.js 에 있다.
      - name: Lighthouse
        run: npm run lhci

      - name: 리포트 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci/
          retention-days: 7
