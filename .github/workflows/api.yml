# ISSUE-000 — apps/api CI
# SPEC-05 §1: 배포는 프론트/백 분리 — 각자의 파이프라인.
# 이 워크플로는 apps/api 만 본다. 프론트 CI 와 서로를 막지 않는다.
name: api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    # Testcontainers 가 Docker 를 쓴다. ubuntu-latest 는 /var/run/docker.sock 이 표준이라
    # build.gradle.kts 의 소켓 탐색이 그대로 통과하고 Ryuk 도 켜진 채로 돈다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # PRIN-T01

      - uses: gradle/actions/setup-gradle@v4

      - name: check (test + boundaryTest)
        working-directory: apps/api
        run: ./gradlew check --no-daemon

      - name: 테스트 리포트 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/
          retention-days: 7
