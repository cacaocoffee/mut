# ISSUE-000 — apps/api CI
# SPEC-05 §1: 배포는 프론트/백 분리 — 각자의 파이프라인.
# 이 워크플로는 apps/api 만 본다. 프론트 CI 와 서로를 막지 않는다.
name: api

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    # Testcontainers 가 Docker 를 쓴다. ubuntu-latest 는 /var/run/docker.sock 이 표준이라
    # build.gradle.kts 의 소켓 탐색이 그대로 통과하고 Ryuk 도 켜진 채로 돈다.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21" # PRIN-T01

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers 가 테스트 안에서 이미지를 받으면 받기 지연이 곧 테스트 실패로 나타난다.
      # 실제로 PR #62 에서 ContainerFetchException 으로 202건이 통째로 무너졌다 —
      # 코드 문제가 아닌데 로그만 보면 그렇게 보이지 않는다.
      # 미리 받아 두면 실패 지점이 여기로 드러나고 재시도도 할 수 있다.
      - name: PG16 이미지 미리 받기
        run: |
          for i in 1 2 3; do
            docker pull postgres:16-alpine && exit 0
            echo "::warning::이미지 받기 실패, 재시도 $i/3"
            sleep 15
          done
          echo "::error::postgres:16-alpine 을 받지 못했다"
          exit 1

      - name: check (test + boundaryTest)
        working-directory: apps/api
        run: ./gradlew check --no-daemon

      - name: 테스트 리포트 보존
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/
          retention-days: 7
