# Fly.io 설정 (ADR-0007 2단계).
#
# 리전이 sin(싱가포르)인 이유 — DB(Neon)가 ap-southeast-1 이다. 요청 하나가
# 쿼리를 여러 번 치므로 API 는 사용자보다 DB 옆에 두는 쪽이 전체 지연이 짧다.
#
# min_machines_running = 1 — 상시 1대 (월 ~$3.19, ADR-0007 이 예산에 넣어 둔 값).
# 0으로 두었더니 어드민 첫 클릭이 JVM 기동 20~40초를 기다렸다 (2026-08-24).
# 어드민 사용이 시작되면서 트래픽이 생겨 1 로 바꿨다.

app = "mut-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/actuator/health"
    interval = "30s"
    timeout = "5s"
    # Flyway 가 기동 때 돈다 — JVM + 마이그레이션 확인 시간을 준다
    grace_period = "60s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
