spring:
  application:
    name: kcocktail-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kcocktail}
    username: ${DB_USER:kcocktail_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false          # 뷰에서 지연 로딩 금지 — 경계를 흐린다
    hibernate:
      ddl-auto: validate         # SPEC-06 §6 — 스키마는 Flyway 만 바꾼다
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 마이그레이션 롤과 앱 롤을 나눈다 (이슈 002)
    user: ${DB_MIGRATE_USER:${DB_USER:kcocktail_app}}
    password: ${DB_MIGRATE_PASSWORD:${DB_PASSWORD:}}
  batch:
    job:
      enabled: false             # SPEC-05 §8 — 기동 시 자동 실행하지 않는다

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health          # 이슈 046 이 확장. 기본은 최소 노출
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
