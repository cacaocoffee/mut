spring:
  application:
    name: mut-api
  datasource:
    # 롤 이름은 V027 이 mut_* 로 바꿨다 (G-40 해소). V001 의 옛 이름은 불변 규칙 때문에
    # 그대로 두고, 새 DB 도 V001 → V027 순서로 같은 곳에 도착한다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mut}
    username: ${DB_USER:mut_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false          # 뷰에서 지연 로딩 금지 — 경계를 흐린다
    hibernate:
      ddl-auto: validate         # SPEC-06 §6 — 스키마는 Flyway 만 바꾼다
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 마이그레이션 롤과 앱 롤을 나눈다 (이슈 002)
    user: ${DB_MIGRATE_USER:${DB_USER:mut_app}}
    password: ${DB_MIGRATE_PASSWORD:${DB_PASSWORD:}}
  session:
    store-type: jdbc             # SPEC-08 §9 — Redis 는 인스턴스가 늘면 재검토
    jdbc:
      initialize-schema: never   # 스키마 정본은 Flyway V005 다 (SPEC-06 §6)
    timeout: 30d                 # 기본값. editor·admin 은 필터가 8시간으로 줄인다
  batch:
    job:
      enabled: false             # SPEC-05 §8 — 기동 시 자동 실행하지 않는다
  servlet:
    multipart:
      # 사진 업로드(ADR-0011). 기본 1MB 는 휴대폰 사진에 모자란다. 원본을 그대로 받되
      # 상한을 둬 대용량 업로드로 메모리를 소진시키는 것을 막는다. 넘으면 413 을 준다.
      max-file-size: 12MB
      max-request-size: 12MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health          # 이슈 046 이 확장. 기본은 최소 노출
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

# ISSUE-005 — 세션 쿠키 (SPEC-08 §4.1)
# 도메인은 환경변수다. 호스팅이 미정이고(G-07), SPEC-07 §1.2 가
# "프론트와 API 가 같은 상위 도메인"을 요구한다.
mut:
  # SPEC-08 §6 — 기본값은 스펙 표 그대로. 사고 시 배포 없이 조이라고 열어 둔다.
  rate-limit:
    enabled: ${MUT_RATE_LIMIT_ENABLED:true}
    limits: {}
  session:
    cookie-name: ${MUT_SESSION_COOKIE_NAME:KCSESSION}
    secure: ${MUT_SESSION_SECURE:true}
    cookie-domain: ${MUT_SESSION_COOKIE_DOMAIN:}
  # SPEC-07 §4 — 방향이 반대인 유일한 호출. 백엔드가 프론트를 부른다.
  # 기본이 꺼짐인 이유: 로컬에서 프론트를 안 띄웠다고 발행이 막히면 안 된다.
  # 운영은 프로파일 검사가 켜기를 강제한다 (RevalidateStartupCheck).
  # SPEC-06 §4.3 — 앱 강제 불변식의 일 1회 이중 확인 (NFR-D-01·D-02·D-04).
  # `cli: true` 면 한 번 돌고 종료 코드를 남긴다 (배포 게이트).
  verification:
    scheduled: ${MUT_VERIFICATION_SCHEDULED:true}
    cli: ${MUT_VERIFICATION_CLI:false}
  # FR-INGREDIENT-001 — "국내 유통 기준 200~300개". 넘으면 경고지 차단이 아니다
  # (DECISIONS §1.2 — 상한 근거가 역검색 UX 이지 무결성이 아니다).
  # 상수가 아니라 설정인 이유: 250 이 맞는지 350 이 맞는지는 목록을 띄워 봐야 알고,
  # 경고 하나 조정하자고 배포하지 않는다 (이슈 026 RED 20).
  ingredient:
    approved-cap: ${MUT_INGREDIENT_APPROVED_CAP:300}
  # ADR-0011 이미지 업로드 — GCS 버킷 이름. 비우면 업로드 엔드포인트가 뜨지 않는다
  # (StorageConfig·MediaUploadController 가 @ConditionalOnProperty 로 걸려 있다).
  # 로컬·테스트·CI 에는 버킷이 없어 GCS 를 아예 부르지 않는다. 운영만 채운다.
  media:
    bucket: ${MUT_MEDIA_BUCKET:}
  revalidate:
    enabled: ${MUT_REVALIDATE_ENABLED:false}
    url: ${MUT_FRONTEND_URL:}
    secret: ${MUT_REVALIDATE_SECRET:}
    timeout-ms: ${MUT_REVALIDATE_TIMEOUT_MS:2000}
  # ISSUE-030 — 소셜 로그인 (SPEC-08 §4.2 · §5.1)
  #
  # 시크릿에 기본값을 두지 않는다. 빠뜨린 채로 기동하면 로그인 시도 때 제공자가 401 을 주고,
  # 사용자에게는 "로그인 실패" 로만 보인다 — 원인이 멀다.
  #
  # scope 가 SPEC-08 §5.1 목록이다. birthday · phone_number 를 넣지 않는 것이 결정이다
  # (ADR-0004) — 요청하면 받게 되고, 받으면 저장하고 싶어진다.
  # ExposureRuleAbsenceTest 와 같은 방식으로 SocialLoginApiTest 가 부재를 지킨다.
  #
  # 엔드포인트 URL 을 열어 둔 이유: 상수로 박으면 테스트가 제공자를 실제로 부르게 되고,
  # CI 가 카카오 장애를 따라 빨개진다. 비우면 제공자 기본값이다.
  oauth:
    # 제공자 콘솔에 등록한 값과 글자 단위로 같아야 한다. 오픈 리다이렉트의 1차 방어선이다.
    redirect-base: ${MUT_OAUTH_REDIRECT_BASE:http://localhost:8080}
    # 로그인 후 되돌아갈 수 있는 프론트 주소. 목록 밖이면 첫 항목으로 간다 (거부가 아니다).
    allowed-returns: ${MUT_OAUTH_ALLOWED_RETURNS:http://localhost:3000}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      scopes: profile_nickname,account_email
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
    # 애플만 client_secret 이 ES256 서명 JWT 다. 개인키는 환경변수로만 들어온다 —
    # 저장소에 들어가는 순간 그 키는 폐기 대상이다.
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key-pem: ${APPLE_PRIVATE_KEY:}
