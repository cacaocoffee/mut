spring:
  application:
    name: kcocktail-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kcocktail}
    username: ${DB_USER:kcocktail_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false          # 뷰에서 지연 로딩 금지 — 경계를 흐린다
    hibernate:
      ddl-auto: validate         # SPEC-06 §6 — 스키마는 Flyway 만 바꾼다
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 마이그레이션 롤과 앱 롤을 나눈다 (이슈 002)
    user: ${DB_MIGRATE_USER:${DB_USER:kcocktail_app}}
    password: ${DB_MIGRATE_PASSWORD:${DB_PASSWORD:}}
  session:
    store-type: jdbc             # SPEC-08 §9 — Redis 는 인스턴스가 늘면 재검토
    jdbc:
      initialize-schema: never   # 스키마 정본은 Flyway V005 다 (SPEC-06 §6)
    timeout: 30d                 # 기본값. editor·admin 은 필터가 8시간으로 줄인다
  batch:
    job:
      enabled: false             # SPEC-05 §8 — 기동 시 자동 실행하지 않는다

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health          # 이슈 046 이 확장. 기본은 최소 노출
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO

# ISSUE-005 — 세션 쿠키 (SPEC-08 §4.1)
# 도메인은 환경변수다. 호스팅이 미정이고(G-07), SPEC-07 §1.2 가
# "프론트와 API 가 같은 상위 도메인"을 요구한다.
kcocktail:
  # SPEC-08 §6 — 기본값은 스펙 표 그대로. 사고 시 배포 없이 조이라고 열어 둔다.
  rate-limit:
    enabled: ${KC_RATE_LIMIT_ENABLED:true}
    limits: {}
  session:
    cookie-name: ${KC_SESSION_COOKIE_NAME:KCSESSION}
    secure: ${KC_SESSION_SECURE:true}
    cookie-domain: ${KC_SESSION_COOKIE_DOMAIN:}
